# This file is a template — values are injected by the CI/CD workflow
# using outputs from Terraform. Do not commit actual secret values.
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-secrets
  namespace: fiapx
type: Opaque
stringData:
  DB_URL: "${DB_URL}"
  DB_USER: "${DB_USER}"
  DB_PASSWORD: "${DB_PASSWORD}"
  AWS_REGION: "${AWS_REGION}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN}"
  SQS_QUEUE_URL: "${SQS_QUEUE_URL}"
  S3_BUCKET: "${S3_BUCKET}"
  NOTIFICATION_URL: "${NOTIFICATION_URL}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fiapx-sa
  namespace: fiapx
