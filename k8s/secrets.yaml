# This file is a template — values are injected by the CI/CD workflow
# using outputs from Terraform. Do not commit actual secret values.
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-secrets
  namespace: fiapx
type: Opaque
stringData:
  DB_URL: "${DB_URL}"
  DB_HOST: "${DB_HOST}"
  DB_PORT: "${DB_PORT}"
  DB_NAME: "${DB_NAME}"
  DB_USER: "${DB_USER}"
  DB_PASSWORD: "${DB_PASSWORD}"
  # IRSA: apps no EKS devem usar credenciais da LabRole via ServiceAccount
  # (não injetar AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN por Secret)
  AWS_REGION: "${AWS_REGION}"
  S3_BUCKET: "${S3_BUCKET}"
  NOTIFICATION_URL: "${NOTIFICATION_URL}"
  RABBITMQ_HOST: "${RABBITMQ_HOST}"
  RABBITMQ_USER: "${RABBITMQ_USER}"
  RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
  RABBITMQ_QUEUE: "${RABBITMQ_QUEUE}"
  RABBITMQ_EXCHANGE: "${RABBITMQ_EXCHANGE}"
  RABBITMQ_ROUTING_KEY: "${RABBITMQ_ROUTING_KEY}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fiapx-sa
  namespace: fiapx
