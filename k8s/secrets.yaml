# This file is a template — values are injected by the CI/CD workflow
# using outputs from Terraform. Do not commit actual secret values.
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-secrets
  namespace: fiapx
type: Opaque
stringData:
  DB_URL: "${DB_URL}"
  DB_USER: "${DB_USER}"
  DB_PASSWORD: "${DB_PASSWORD}"
  AWS_REGION: "${AWS_REGION}"
  SQS_QUEUE_URL: "${SQS_QUEUE_URL}"
  S3_BUCKET: "${S3_BUCKET}"
  NOTIFICATION_URL: "${NOTIFICATION_URL}"
  EMAIL_USER: "${EMAIL_USER}"
  EMAIL_PWD: "${EMAIL_PWD}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fiapx-sa
  namespace: fiapx
  annotations:
    eks.amazonaws.com/role-arn: "${IRSA_ROLE_ARN}"
