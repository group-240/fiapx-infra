name: Infrastructure — Terraform + K8s

on:
  push:
    branches: [fix]
  workflow_dispatch:
    inputs:
      eks_cluster_role_name:
        description: "IAM role name for EKS cluster (AWS Academy)"
        required: false
        default: "LabEksClusterRole"
      eks_node_role_name:
        description: "IAM role name for EKS node group (AWS Academy)"
        required: false
        default: "LabEksNodeRole"

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_STATE_BUCKET: fiapx-terraform-state
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_rabbitmq_user: ${{ secrets.RABBITMQ_USER }}
  TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
  TF_VAR_eks_cluster_role_name: ${{ github.event.inputs.eks_cluster_role_name || 'LabEksClusterRole' }}
  TF_VAR_eks_node_role_name: ${{ github.event.inputs.eks_node_role_name || 'LabEksNodeRole' }}

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    outputs:
      eks_cluster_name: ${{ steps.tf_outputs.outputs.eks_cluster_name }}
      ecr_fiapx_url: ${{ steps.tf_outputs.outputs.ecr_fiapx_url }}
      ecr_processing_url: ${{ steps.tf_outputs.outputs.ecr_processing_url }}
      rabbitmq_host: ${{ steps.tf_outputs.outputs.rabbitmq_host }}
      s3_bucket_name: ${{ steps.tf_outputs.outputs.s3_bucket_name }}
      rds_endpoint: ${{ steps.tf_outputs.outputs.rds_endpoint }}
      rds_host: ${{ steps.tf_outputs.outputs.rds_host }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Bootstrap Terraform state bucket (idempotente)
        run: |
          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Bucket $TF_STATE_BUCKET já existe, seguindo..."
          else
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            echo "Bucket $TF_STATE_BUCKET criado com sucesso."
          fi

          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled

          aws s3api put-public-access-block \
            --bucket "$TF_STATE_BUCKET" \
            --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"

          aws s3api put-bucket-encryption \
            --bucket "$TF_STATE_BUCKET" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

      - name: Pre-check AWS identity and EKS roles
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "AWS account: $ACCOUNT_ID"
          echo "Caller ARN : $CALLER_ARN"
          echo "EKS cluster role inicial: $TF_VAR_eks_cluster_role_name"
          echo "EKS node role inicial   : $TF_VAR_eks_node_role_name"

          if ! aws iam get-role --role-name "$TF_VAR_eks_cluster_role_name" >/dev/null 2>&1; then
            AUTO_CLUSTER_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName, 'LabEksClusterRole')].RoleName | [0]" --output text)
            if [ -n "$AUTO_CLUSTER_ROLE" ] && [ "$AUTO_CLUSTER_ROLE" != "None" ]; then
              echo "TF_VAR_eks_cluster_role_name=$AUTO_CLUSTER_ROLE" >> "$GITHUB_ENV"
              export TF_VAR_eks_cluster_role_name="$AUTO_CLUSTER_ROLE"
              echo "Role de cluster auto-detectada: $TF_VAR_eks_cluster_role_name"
            else
              echo "ERRO: role de cluster não encontrada."
              echo "Tentou nome explícito: LabEksClusterRole"
              echo "E também não encontrou role contendo 'LabEksClusterRole'."
              exit 1
            fi
          fi

          if ! aws iam get-role --role-name "$TF_VAR_eks_node_role_name" >/dev/null 2>&1; then
            AUTO_NODE_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName, 'LabEksNodeRole')].RoleName | [0]" --output text)
            if [ -n "$AUTO_NODE_ROLE" ] && [ "$AUTO_NODE_ROLE" != "None" ]; then
              echo "TF_VAR_eks_node_role_name=$AUTO_NODE_ROLE" >> "$GITHUB_ENV"
              export TF_VAR_eks_node_role_name="$AUTO_NODE_ROLE"
              echo "Role de node auto-detectada: $TF_VAR_eks_node_role_name"
            else
              echo "ERRO: role de node não encontrada."
              echo "Tentou nome explícito: LabEksNodeRole"
              echo "E também não encontrou role contendo 'LabEksNodeRole'."
              exit 1
            fi
          fi

          echo "EKS cluster role final: $TF_VAR_eks_cluster_role_name"
          echo "EKS node role final   : $TF_VAR_eks_node_role_name"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Extract Terraform outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecr_fiapx_url=$(terraform output -raw ecr_fiapx_url)" >> $GITHUB_OUTPUT
          echo "ecr_processing_url=$(terraform output -raw ecr_processing_url)" >> $GITHUB_OUTPUT
          echo "rabbitmq_host=$(terraform output -raw rabbitmq_host)" >> $GITHUB_OUTPUT
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
          echo "rds_host=$(terraform output -raw rds_host)" >> $GITHUB_OUTPUT

  apply_k8s:
    name: Apply K8s Manifests
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ needs.terraform.outputs.eks_cluster_name }}

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Create/Update K8s Secrets
        run: |
          # rds_host vem diretamente do output Terraform (aws_db_instance.address, sem porta).
          # Evita o problema de sensitive=true mascarar o valor entre jobs do GitHub Actions.
          DB_HOST="${{ needs.terraform.outputs.rds_host }}"

          sed \
            -e "s|\${DB_URL}|jdbc:postgresql://${DB_HOST}:5432/${{ secrets.DB_NAME }}|g" \
            -e "s|\${DB_HOST}|${DB_HOST}|g" \
            -e "s|\${DB_PORT}|5432|g" \
            -e "s|\${DB_NAME}|${{ secrets.DB_NAME }}|g" \
            -e "s|\${DB_USER}|${{ secrets.DB_USER }}|g" \
            -e "s|\${DB_PASSWORD}|${{ secrets.DB_PASSWORD }}|g" \
            -e "s|\${AWS_REGION}|${{ secrets.AWS_REGION }}|g" \
            -e "s|\${AWS_ACCESS_KEY_ID}|${{ secrets.AWS_ACCESS_KEY_ID }}|g" \
            -e "s|\${AWS_SECRET_ACCESS_KEY}|${{ secrets.AWS_SECRET_ACCESS_KEY }}|g" \
            -e "s|\${AWS_SESSION_TOKEN}|${{ secrets.AWS_SESSION_TOKEN }}|g" \
            -e "s|\${S3_BUCKET}|${{ needs.terraform.outputs.s3_bucket_name }}|g" \
            -e "s|\${NOTIFICATION_URL}|http://fiapx:8888/api/capturas/update-status|g" \
            -e "s|\${RABBITMQ_HOST}|${{ needs.terraform.outputs.rabbitmq_host }}|g" \
            -e "s|\${RABBITMQ_USER}|${{ secrets.RABBITMQ_USER }}|g" \
            -e "s|\${RABBITMQ_PASSWORD}|${{ secrets.RABBITMQ_PASSWORD }}|g" \
            -e "s|\${RABBITMQ_QUEUE}|${{ secrets.RABBITMQ_QUEUE_NAME }}|g" \
            -e "s|\${RABBITMQ_EXCHANGE}|${{ secrets.RABBITMQ_EXCHANGE_NAME }}|g" \
            -e "s|\${RABBITMQ_ROUTING_KEY}|${{ secrets.RABBITMQ_ROUTING_KEY }}|g" \
            k8s/secrets.yaml | kubectl apply -f -

      - name: Apply Ingress
        run: kubectl apply -f k8s/ingress.yaml

      - name: Apply Grafana Ingress
        run: kubectl apply -f k8s/monitoring/ingress-grafana.yaml

      - name: Apply Grafana Dashboards
        run: kubectl apply -f k8s/monitoring/dashboard-e2e-fiapx.yaml

      - name: Configure Grafana root_url/domain for ingress
        run: |
          GRAFANA_LB_HOST=$(kubectl get ingress grafana-ingress -n monitoring -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [ -z "$GRAFANA_LB_HOST" ]; then
            echo "Grafana ingress hostname ainda não disponível; mantendo configuração atual."
            exit 0
          fi

          kubectl set env deployment/prometheus-stack-grafana -n monitoring \
            GF_SERVER_DOMAIN="$GRAFANA_LB_HOST" \
            GF_SERVER_ROOT_URL="%(protocol)s://$GRAFANA_LB_HOST/grafana/" \
            GF_SERVER_SERVE_FROM_SUB_PATH="true"

          kubectl rollout status deployment/prometheus-stack-grafana -n monitoring --timeout=180s
